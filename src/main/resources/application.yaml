spring:
  application:
    name: graphql-rpg
  sql:
    init:
      mode: always

  datasource:
    url: jdbc:h2:mem:rpgdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    defer-datasource-initialization: true
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true

  graphql:
    websocket:
      path: /graphql

  h2:
    console:
      enabled: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.stat: debug