<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>BATTLE // graphql-rpg-lab</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

        :root {
            --bg: #0a0f0a;
            --panel: #0f1a0f;
            --line: #1f3d1f;
            --green: #5cf26a;
            --green-dim: #2f8f3d;
            --amber: #ffb000;
            --red: #ff4d4d;
            --blue: #4a90d9;
            --text: #c8f5c8;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            background-image: repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px);
            color: var(--text);
            font-family: 'VT323', monospace;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .crt {
            width: 100%;
            max-width: 760px;
            border: 2px solid var(--green-dim);
            border-radius: 4px;
            box-shadow: 0 0 0 1px #000, 0 0 24px rgba(92,242,106,0.15), inset 0 0 40px rgba(0,0,0,0.6);
            background: var(--panel);
            padding: 20px 24px 24px;
        }

        .title {
            font-family: 'Press Start 2P', monospace;
            font-size: 13px;
            color: var(--green);
            letter-spacing: 1px;
            margin-bottom: 4px;
            text-shadow: 0 0 6px rgba(92,242,106,0.6);
        }

        .subtitle {
            color: var(--green-dim);
            font-size: 14px;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        /* 플레이어 생성 화면 */
        .create-screen {
            text-align: center;
            padding: 20px 0;
        }

        .create-screen .prompt {
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            color: var(--green-dim);
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .create-screen input {
            width: 100%;
            background: #060906;
            color: var(--green);
            border: 2px solid var(--green-dim);
            font-family: 'VT323', monospace;
            font-size: 24px;
            padding: 10px 14px;
            margin-bottom: 16px;
            outline: none;
            text-align: center;
            letter-spacing: 2px;
        }

        .create-screen input:focus { border-color: var(--green); }

        .create-screen input::placeholder { color: var(--green-dim); }

        /* 전투 화면 */
        .battle-screen { display: none; }

        .row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 12px;
            align-items: stretch;
            margin-bottom: 16px;
        }

        .vs {
            align-self: center;
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            color: var(--amber);
            text-align: center;
        }

        .unit {
            border: 1px solid var(--line);
            border-radius: 3px;
            padding: 12px 14px;
            background: rgba(0,0,0,0.25);
        }

        .unit.player { border-color: #2f6f8f; }
        .unit.monster { border-color: #8f2f2f; }

        .unit-label {
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            color: var(--green-dim);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        select {
            width: 100%;
            background: #060906;
            color: var(--text);
            border: 1px solid var(--line);
            font-family: 'VT323', monospace;
            font-size: 18px;
            padding: 6px 8px;
            margin-bottom: 8px;
        }

        .stats-row {
            display: flex;
            gap: 10px;
            font-size: 15px;
            color: var(--green-dim);
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .stats-row span { color: var(--green); }

        .bar-label {
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            color: var(--green-dim);
            margin-bottom: 4px;
        }

        .bar {
            height: 14px;
            background: #060906;
            border: 1px solid var(--line);
            overflow: hidden;
            margin-bottom: 6px;
        }

        .bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.4s steps(12);
        }

        .bar-fill.hp { background: linear-gradient(90deg, var(--green-dim), var(--green)); }
        .bar-fill.hp.low { background: linear-gradient(90deg, #7a1f1f, var(--red)); }
        .bar-fill.exp { background: linear-gradient(90deg, #1a4a8a, var(--blue)); }

        .controls {
            display: flex;
            gap: 10px;
            margin: 18px 0 16px;
        }

        button {
            flex: 1;
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            padding: 14px 8px;
            background: #060906;
            color: var(--green);
            border: 2px solid var(--green-dim);
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.1s;
        }

        button:hover:not(:disabled) { background: var(--green-dim); color: #060906; }
        button:active:not(:disabled) { transform: translateY(1px); }
        button.flee { color: var(--amber); border-color: #8a6000; }
        button.flee:hover:not(:disabled) { background: #8a6000; color: #060906; }
        button.auto { color: #4af; border-color: #1a4a8a; }
        button.auto:hover:not(:disabled) { background: #1a4a8a; color: #060906; }
        button:disabled { opacity: 0.35; cursor: not-allowed; }

        .log {
            border: 1px solid var(--line);
            background: #060906;
            padding: 10px 12px;
            height: 160px;
            overflow-y: auto;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .log::-webkit-scrollbar { width: 8px; }
        .log::-webkit-scrollbar-thumb { background: var(--green-dim); }
        .log::-webkit-scrollbar-track { background: #060906; }

        .log p { margin: 0 0 4px; }
        .log p.sys { color: var(--green-dim); }
        .log p.crit { color: var(--amber); }
        .log p.dead { color: var(--red); }
        .log p.levelup { color: #4af; }
        .log p.drop { color: var(--amber); }
        .log p.auto { color: #4af; }
        .log .cursor {
            display: inline-block;
            width: 8px;
            background: var(--green);
            animation: blink 1s steps(1) infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }

        .inventory-label {
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            color: var(--green-dim);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .inventory-items {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            min-height: 28px;
        }

        .inventory-item {
            background: #0f1a0f;
            border: 1px solid var(--green-dim);
            padding: 3px 8px;
            font-size: 15px;
            color: var(--text);
        }

        .inventory-item .bonus {
            color: var(--green);
            font-size: 13px;
        }

        .inventory-empty { color: var(--green-dim); font-size: 15px; }

        .footer-note {
            margin-top: 14px;
            font-size: 13px;
            color: var(--green-dim);
            text-align: center;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="crt">
    <div class="title">⚔ BATTLE.EXE</div>
    <div class="subtitle">graphql-rpg-lab // turn-based combat test console</div>

    <!-- 플레이어 생성 화면 -->
    <div class="create-screen" id="createScreen">
        <div class="prompt">ENTER YOUR NAME, HERO</div>
        <input type="text" id="playerNameInput" placeholder="HERO NAME" maxlength="20">
        <button onclick="createPlayer()">▶ START GAME</button>
    </div>

    <!-- 전투 화면 -->
    <div class="battle-screen" id="battleScreen">
        <div class="row">
            <div class="unit player">
                <div class="unit-label">PLAYER</div>
                <div style="font-size:18px; color:var(--green); margin-bottom:8px;" id="playerName">-</div>
                <div class="stats-row">
                    LV.<span id="statLv">-</span>
                    &nbsp;ATK.<span id="statAtk">-</span>
                    &nbsp;DEF.<span id="statDef">-</span>
                    &nbsp;SPD.<span id="statSpd">-</span>
                </div>
                <div class="bar-label"><span>HP</span><span id="playerHpText">--/--</span></div>
                <div class="bar"><div class="bar-fill hp" id="playerHpFill"></div></div>
                <div class="bar-label"><span>EXP</span><span id="playerExpText">-/-</span></div>
                <div class="bar"><div class="bar-fill exp" id="playerExpFill"></div></div>
                <div class="inventory-label" style="margin-top:10px;">INVENTORY</div>
                <div class="inventory-items" id="inventoryItems">
                    <span class="inventory-empty">empty</span>
                </div>
            </div>

            <div class="vs">VS</div>

            <div class="unit monster">
                <div class="unit-label">MONSTER</div>
                <select id="monsterSelect"></select>
                <div class="stats-row">
                    ATK.<span id="statMonsterAtk">-</span>
                </div>
                <div class="bar-label"><span>HP</span><span id="monsterHpText">--/--</span></div>
                <div class="bar"><div class="bar-fill hp" id="monsterHpFill"></div></div>
            </div>
        </div>

        <div class="controls">
            <button id="attackBtn" onclick="doAttack()">⚔ ATTACK</button>
            <button id="fleeBtn" class="flee" onclick="doFlee()">🏃 FLEE</button>
            <button id="autoBtn" class="auto" onclick="doAutoBattle()">⚡ AUTO</button>
        </div>

        <div class="log" id="log">
            <p class="sys">&gt; system ready. select a monster and press attack.<span class="cursor">&nbsp;</span></p>
        </div>
    </div>

    <div class="footer-note">localhost:8080/graphql — Step 8 Context</div>
</div>

<script>
    const API = 'http://localhost:8080/graphql';
    const WS_URL = 'ws://localhost:8080/graphql';
    const PLAYER_ID_KEY = 'rpg_player_id';

    let currentMonsterMaxHp = 100;
    let currentPlayerMaxHp = 100;
    let currentMonsterHp = 0;
    let currentPlayerLevel = 1;
    let currentPlayerExp = 0;
    let monsterDefeated = false;
    let playerId = null;

    // X-Player-Id 헤더 자동 추가
    async function graphql(query) {
        const headers = { 'Content-Type': 'application/json' };
        if (playerId) headers['X-Player-Id'] = playerId;

        const res = await fetch(API, {
            method: 'POST',
            headers,
            body: JSON.stringify({ query })
        });
        const json = await res.json();
        if (json.errors) {
            log(json.errors[0].message, 'dead');
            throw new Error(json.errors[0].message);
        }
        return json.data;
    }

    function log(message, cls) {
        const el = document.getElementById('log');
        document.querySelectorAll('.cursor').forEach(c => c.parentElement.remove());
        const p = document.createElement('p');
        if (cls) p.className = cls;
        p.innerHTML = '&gt; ' + message;
        el.appendChild(p);
        const cursorP = document.createElement('p');
        cursorP.className = 'sys';
        cursorP.innerHTML = '<span class="cursor">&nbsp;</span>';
        el.appendChild(cursorP);
        el.scrollTop = el.scrollHeight;
    }

    function setHpBar(fillId, textId, current, max) {
        const fill = document.getElementById(fillId);
        const text = document.getElementById(textId);
        const pct = Math.max(0, Math.min(100, (current / max) * 100));
        fill.style.width = pct + '%';
        fill.classList.toggle('low', pct <= 30);
        text.textContent = `${Math.max(0, current)}/${max}`;
    }

    function setExpBar(exp, level) {
        const nextLevelExp = level * 100;
        const pct = Math.min(100, (exp / nextLevelExp) * 100);
        document.getElementById('playerExpFill').style.width = pct + '%';
        document.getElementById('playerExpText').textContent = `${exp}/${nextLevelExp}`;
        currentPlayerExp = exp;
    }

    function updatePlayerDisplay(player) {
        currentPlayerLevel = player.level;
        currentPlayerMaxHp = player.maxHp;
        const items = player.inventory?.items || [];
        const atkBonus = items.reduce((sum, i) => sum + i.attackBonus, 0);
        const defBonus = items.reduce((sum, i) => sum + i.defenseBonus, 0);
        document.getElementById('playerName').textContent = player.name;
        document.getElementById('statLv').textContent = player.level;
        document.getElementById('statAtk').textContent = atkBonus > 0 ? `${player.stats.attack}+${atkBonus}` : player.stats.attack;
        document.getElementById('statDef').textContent = defBonus > 0 ? `${player.stats.defense}+${defBonus}` : player.stats.defense;
        document.getElementById('statSpd').textContent = player.stats.speed;
        setHpBar('playerHpFill', 'playerHpText', player.hp, player.maxHp);
        setExpBar(player.exp, player.level);
    }

    function updateMonsterDisplay(monster) {
        document.getElementById('statMonsterAtk').textContent = monster.attackPower;
        currentMonsterMaxHp = monster.maxHp;
        currentMonsterHp = monster.maxHp;
        setHpBar('monsterHpFill', 'monsterHpText', monster.maxHp, monster.maxHp);
    }

    function updateInventoryDisplay(items) {
        const el = document.getElementById('inventoryItems');
        if (!items || items.length === 0) {
            el.innerHTML = '<span class="inventory-empty">empty</span>';
            return;
        }
        el.innerHTML = items.map(item => {
            const bonuses = [];
            if (item.attackBonus > 0) bonuses.push(`ATK+${item.attackBonus}`);
            if (item.defenseBonus > 0) bonuses.push(`DEF+${item.defenseBonus}`);
            const bonusText = bonuses.length > 0 ? ` <span class="bonus">${bonuses.join(' ')}</span>` : '';
            return `<div class="inventory-item">${item.name}${bonusText}</div>`;
        }).join('');
    }

    async function createPlayer() {
        const name = document.getElementById('playerNameInput').value.trim();
        if (!name) return;

        const data = await graphql(`
            mutation {
                createPlayer(input: { name: "${name}" }) {
                    id name
                }
            }
        `);

        playerId = data.createPlayer.id;
        localStorage.setItem(PLAYER_ID_KEY, playerId);
        showBattleScreen();
    }

    async function showBattleScreen() {
        document.getElementById('createScreen').style.display = 'none';
        document.getElementById('battleScreen').style.display = 'block';

        // 몬스터 목록 로드
        const data = await graphql(`{ monsters { id name } }`);
        document.getElementById('monsterSelect').innerHTML =
            data.monsters.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
        document.getElementById('monsterSelect').onchange = syncSelection;

        // 플레이어 정보 로드
        await loadPlayer();
        syncSelection();
    }

    async function loadPlayer() {
        try {
            const data = await graphql(`{
            player(id: ${playerId}) {
                id name level hp maxHp exp
                stats { attack defense speed }
                inventory { items { id name attackBonus defenseBonus } }
            }
        }`);
            updatePlayerDisplay(data.player);
            updateInventoryDisplay(data.player.inventory?.items);
        } catch (e) {
            localStorage.removeItem(PLAYER_ID_KEY);
            playerId = null;
            document.getElementById('battleScreen').style.display = 'none';
            document.getElementById('createScreen').style.display = 'block';
        }
    }

    async function syncSelection() {
        const mid = document.getElementById('monsterSelect').value;
        if (!mid) return;

        const data = await graphql(`{
            monster(id: ${mid}) { id name hp maxHp attackPower }
        }`);

        monsterDefeated = false;
        updateMonsterDisplay(data.monster);
        setButtonsDisabled(false);
    }

    function setButtonsDisabled(disabled) {
        document.getElementById('attackBtn').disabled = disabled;
        document.getElementById('fleeBtn').disabled = disabled;
        document.getElementById('autoBtn').disabled = disabled;
    }

    async function doAttack() {
        if (monsterDefeated) return;
        const monsterId = document.getElementById('monsterSelect').value;
        if (!monsterId) return;

        setButtonsDisabled(true);
        try {
            const data = await graphql(`
                mutation {
                    attack(monsterId: ${monsterId}, currentMonsterHp: ${currentMonsterHp}) {
                        playerDamage monsterDamage monsterRemainHp playerRemainHp
                        isCritical monsterDefeated playerDefeated
                        expGained levelUps
                        droppedItem { name type attackBonus defenseBonus }
                        message
                    }
                }
            `);
            const r = data.attack;

            currentMonsterHp = r.monsterRemainHp;
            setHpBar('monsterHpFill', 'monsterHpText', r.monsterRemainHp, currentMonsterMaxHp);
            setHpBar('playerHpFill', 'playerHpText', r.playerRemainHp, currentPlayerMaxHp);
            log(r.message, r.isCritical ? 'crit' : null);

            if (r.expGained > 0) log(`경험치 +${r.expGained} 획득!`, 'sys');

            if (r.droppedItem) {
                const bonuses = [];
                if (r.droppedItem.attackBonus > 0) bonuses.push(`ATK+${r.droppedItem.attackBonus}`);
                if (r.droppedItem.defenseBonus > 0) bonuses.push(`DEF+${r.droppedItem.defenseBonus}`);
                const bonusText = bonuses.length > 0 ? ` (${bonuses.join(' ')})` : '';
                log(`★ 아이템 드롭! [${r.droppedItem.type}] ${r.droppedItem.name}${bonusText}`, 'drop');
            }

            if (r.levelUps > 0) {
                log(`★ LEVEL UP! Lv.${currentPlayerLevel} → Lv.${currentPlayerLevel + r.levelUps} ★`, 'levelup');
            }

            if (r.levelUps > 0 || r.droppedItem) {
                await loadPlayer();
            } else if (r.expGained > 0) {
                setExpBar(currentPlayerExp + r.expGained, currentPlayerLevel);
            }

            if (r.monsterDefeated) {
                monsterDefeated = true;
                log('monster defeated. select a new monster to continue.', 'dead');
                setButtonsDisabled(true);
                return;
            }
            if (r.playerDefeated) {
                log('player has fallen. battle lost.', 'dead');
                setButtonsDisabled(true);
                return;
            }
        } catch (e) {}
        setButtonsDisabled(false);
    }

    async function doFlee() {
        const monsterId = document.getElementById('monsterSelect').value;
        if (!monsterId) return;

        setButtonsDisabled(true);
        try {
            const data = await graphql(`
                mutation {
                    flee(monsterId: ${monsterId}) {
                        message
                    }
                }
            `);
            log(data.flee.message, 'sys');
            monsterDefeated = false;
            currentMonsterHp = currentMonsterMaxHp;
            setHpBar('monsterHpFill', 'monsterHpText', currentMonsterMaxHp, currentMonsterMaxHp);
        } catch (e) {}
        setButtonsDisabled(false);
    }

    function doAutoBattle() {
        if (monsterDefeated) return;
        const monsterId = document.getElementById('monsterSelect').value;
        if (!monsterId) return;

        setButtonsDisabled(true);
        log('⚡ AUTO BATTLE START', 'auto');

        const ws = new WebSocket(WS_URL, 'graphql-transport-ws');

        ws.onopen = () => {
            ws.send(JSON.stringify({
                type: 'connection_init',
                payload: { 'X-Player-Id': playerId }
            }));
        };

        ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);

            if (msg.type === 'connection_ack') {
                ws.send(JSON.stringify({
                    id: '1',
                    type: 'subscribe',
                    payload: {
                        query: `subscription {
                            battleEvents(playerId: "${playerId}", monsterId: "${monsterId}") {
                                battleId turn playerDamage monsterDamage
                                monsterRemainHp playerRemainHp isCritical
                                monsterDefeated playerDefeated message finished
                            }
                        }`
                    }
                }));
            }

            if (msg.type === 'next') {
                const r = msg.payload.data.battleEvents;

                currentMonsterHp = r.monsterRemainHp;
                setHpBar('monsterHpFill', 'monsterHpText', r.monsterRemainHp, currentMonsterMaxHp);
                setHpBar('playerHpFill', 'playerHpText', r.playerRemainHp, currentPlayerMaxHp);
                log(`[턴 ${r.turn}] ${r.message}`, r.isCritical ? 'crit' : null);

                if (r.finished) {
                    if (r.monsterDefeated) {
                        monsterDefeated = true;
                        log('monster defeated. select a new monster to continue.', 'dead');
                    }
                    if (r.playerDefeated) {
                        log('player has fallen. battle lost.', 'dead');
                    }
                    ws.close();

                    loadPlayer().then(() => {
                        updateInventoryDisplay(null);
                        graphql(`{
                            player(id: ${playerId}) {
                                inventory { items { id name attackBonus defenseBonus } }
                            }
                        }`).then(d => {
                            updateInventoryDisplay(d.player.inventory?.items);
                        });
                        if (!r.playerDefeated) setButtonsDisabled(false);
                    });
                }
            }

            if (msg.type === 'error') {
                log('auto battle error', 'dead');
                ws.close();
                setButtonsDisabled(false);
            }
        };

        ws.onerror = () => {
            log('websocket connection failed', 'dead');
            setButtonsDisabled(false);
        };
    }

    // 초기화 — 로컬스토리지에 playerId 있으면 바로 전투 화면
    function init() {
        const savedId = localStorage.getItem(PLAYER_ID_KEY);
        if (savedId) {
            playerId = savedId;
            showBattleScreen();
        }
        // 엔터키로 플레이어 생성
        document.getElementById('playerNameInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') createPlayer();
        });
    }

    init();
</script>

</body>
</html>
